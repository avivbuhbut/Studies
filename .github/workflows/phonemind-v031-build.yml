name: PhoneMind v0.3.1 Reliability APK Build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Reassemble verified v0.3 source
        run: |
          cat phonemind_v030_chunks/chunk_* > PhoneMindAndroid_v030.zip
          echo '9271e6f1be1eddd508aeb5c4a1b7894fcf2823b999f0098f829d7e247fc47286  PhoneMindAndroid_v030.zip' | sha256sum -c -
          unzip -t PhoneMindAndroid_v030.zip
          unzip -q PhoneMindAndroid_v030.zip
      - name: Apply reliability-only patch
        run: |
          python3 phonemind-v031-patch.py PhoneMindAndroid
          python3 phonemind-v031-compile-hotfix.py
          grep -q 'versionName = "0.3.1"' PhoneMindAndroid/app/build.gradle.kts
          grep -q 'DriveBackupWorker' PhoneMindAndroid/app/src/main/java/com/aviv/phonemind/MainActivity.kt
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' PhoneMindAndroid/app/src/main/AndroidManifest.xml
          grep -q 'android.content.pm.ServiceInfo' PhoneMindAndroid/app/src/main/java/com/aviv/phonemind/DriveBackupWorker.kt
      - name: Compile and verify release APK
        run: |
          set -euo pipefail
          cd PhoneMindAndroid
          gradle --no-daemon clean :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk PhoneMind-v0.3.1-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 PhoneMind-v0.3.1-aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging PhoneMind-v0.3.1-aligned-unsigned.apk | head -20 | tee build-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions PhoneMind-v0.3.1-aligned-unsigned.apk | tee permissions.txt
          grep -q "package: name='com.aviv.phonemind'" build-info.txt
          grep -q "versionCode='4'" build-info.txt
          grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE_DATA_SYNC" permissions.txt
          ! grep -q "android.permission.READ_SMS" permissions.txt
          ! grep -q "android.permission.SEND_SMS" permissions.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar
      - name: Upload unsigned verified build
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMind-v0.3.1-Reliability-Unsigned
          path: |
            PhoneMindAndroid/PhoneMind-v0.3.1-aligned-unsigned.apk
            PhoneMindAndroid/apksigner.jar
            PhoneMindAndroid/build-info.txt
            PhoneMindAndroid/permissions.txt
          if-no-files-found: error
