name: Build TwoFinger APK

on:
  push:
    branches: [ twofinger-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: TwoFinger
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp TwoFinger/app/build/outputs/apk/debug/app-debug.apk TwoFinger-v1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TwoFinger-v1-APK
          path: TwoFinger-v1.apk
          if-no-files-found: error
